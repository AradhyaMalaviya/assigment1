          <text x="16" y="24" fill="#f8fafc" font-size="14" font-weight="600">Customer Feedback Survey Q3</text>
          <text x="16" y="44" fill="#94a3b8" font-size="12">📅 Aug 28, 2026, 11:00 AM • 80 contacts • Sequential</text>
          <rect x="380" y="16" width="76" height="24" rx="6" fill="#0284c7"/>
          <text x="418" y="32" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">SCHEDULED</text>
