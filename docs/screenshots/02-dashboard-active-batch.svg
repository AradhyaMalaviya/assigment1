          <text x="28" y="34" fill="#94a3b8" font-size="12">Job #job_98b4f1 initiated with 100 recipients (AWS SES)</text>
          <text x="472" y="16" fill="#64748b" font-size="11" text-anchor="end">12 mins ago</text>
