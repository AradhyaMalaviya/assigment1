          <circle cx="12" cy="12" r="6" fill="#10b981"/>
          <line x1="12" y1="20" x2="12" y2="60" stroke="#334155" stroke-width="2"/>
          <text x="28" y="16" fill="#f8fafc" font-size="13" font-weight="600">Campaign Scheduled</text>
          <text x="28" y="34" fill="#94a3b8" font-size="12">Weekly Tech Newsletter #142 queued for Aug 22, 09:00 AM</text>
