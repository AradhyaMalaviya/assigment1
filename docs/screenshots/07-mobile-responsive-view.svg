    <g transform="translate(24, 85)">
      <!-- Card 1 (Sent) -->
      <g transform="translate(0, 0)">
        <rect width="327" height="115" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="24" fill="#f8fafc" font-size="13" font-weight="600">sarah.connor@cyberdyne.io</text>
        <rect x="250" y="10" width="62" height="20" rx="4" fill="#064e3b"/>
        <text x="281" y="24" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">✓ Sent</text>
        
        <text x="14" y="46" fill="#94a3b8" font-size="11">Sarah • Cyberdyne</text>
        <text x="14" y="66" fill="#cbd5e1" font-size="11">Subject: Exclusive Invitation for Sarah...</text>
        <text x="14" y="86" fill="#64748b" font-size="10">Aug 20, 2026, 18:04:12 • ID: &lt;msg_98b4f1_01&gt;</text>
      </g>

      <!-- Card 2 (Failed) -->
      <g transform="translate(0, 125)">
        <rect width="327" height="115" rx="10" fill="#1e293b" stroke="#450a0a" stroke-width="1"/>
        <text x="14" y="24" fill="#f8fafc" font-size="13" font-weight="600">invalid@invalid-domain.xyz</text>
        <rect x="250" y="10" width="62" height="20" rx="4" fill="#450a0a"/>
        <text x="281" y="24" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">✖ Failed</text>
        
        <text x="14" y="46" fill="#94a3b8" font-size="11">Alex • Unknown</text>
        <text x="14" y="66" fill="#cbd5e1" font-size="11">Subject: Exclusive Invitation for Alex...</text>
        <text x="14" y="86" fill="#f43f5e" font-size="10">Error: 550 5.1.1 Recipient address rejected</text>
      </g>

      <!-- Card 3 (Sent) -->
      <g transform="translate(0, 250)">
        <rect width="327" height="115" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="24" fill="#f8fafc" font-size="13" font-weight="600">bruce.wayne@waynecorp.com</text>
        <rect x="250" y="10" width="62" height="20" rx="4" fill="#064e3b"/>
        <text x="281" y="24" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">✓ Sent</text>
        
        <text x="14" y="46" fill="#94a3b8" font-size="11">Bruce • Wayne Corp</text>
        <text x="14" y="66" fill="#cbd5e1" font-size="11">Subject: Exclusive Invitation for Bruce...</text>
        <text x="14" y="86" fill="#64748b" font-size="10">Aug 20, 2026, 18:04:57 • ID: &lt;msg_98b4f1_02&gt;</text>
      </g>

      <!-- Card 4 (Sent) -->
      <g transform="translate(0, 375)">
        <rect width="327" height="115" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="24" fill="#f8fafc" font-size="13" font-weight="600">tony.stark@starkindustries.com</text>
        <rect x="250" y="10" width="62" height="20" rx="4" fill="#064e3b"/>
        <text x="281" y="24" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">✓ Sent</text>
        
        <text x="14" y="46" fill="#94a3b8" font-size="11">Tony • Stark Ind</text>
        <text x="14" y="66" fill="#cbd5e1" font-size="11">Subject: Exclusive Invitation for Tony...</text>
        <text x="14" y="86" fill="#64748b" font-size="10">Aug 20, 2026, 18:06:27 • ID: &lt;msg_98b4f1_04&gt;</text>
      </g>
