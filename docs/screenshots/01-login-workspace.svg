<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#0f172a;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg-grad)"/>

  <!-- Brand / Header -->
  <g transform="translate(450, 100)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#4f46e5" />
    <path d="M16 20 L28 30 L40 20 M16 20 L40 20 L40 36 L16 36 Z" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="38" fill="#ffffff" font-size="28" font-weight="700" letter-spacing="-0.5">Bulk Email Sender</text>
    <text x="70" y="58" fill="#94a3b8" font-size="14">Enterprise SvelteKit Campaign Platform</text>
  </g>

  <!-- Login Card Container -->
  <g transform="translate(375, 190)">
    <rect width="450" height="520" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    
    <!-- Tab navigation -->
    <rect x="24" y="24" width="402" height="44" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="28" y="28" width="195" height="36" rx="8" fill="#4f46e5"/>
    <text x="125" y="51" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Sign In</text>
    <text x="325" y="51" fill="#94a3b8" font-size="14" font-weight="500" text-anchor="middle">Register</text>

    <!-- Welcome Text -->
    <text x="24" y="105" fill="#f8fafc" font-size="20" font-weight="700">Welcome back</text>
    <text x="24" y="126" fill="#94a3b8" font-size="13">Sign in to manage and dispatch email campaigns</text>

    <!-- Email Field -->
    <text x="24" y="165" fill="#cbd5e1" font-size="13" font-weight="500">Email Address</text>
    <rect x="24" y="175" width="402" height="44" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="40" y="202" fill="#f8fafc" font-size="14">alex.developer@company.com</text>

    <!-- Password Field -->
    <text x="24" y="245" fill="#cbd5e1" font-size="13" font-weight="500">Password</text>
    <rect x="24" y="255" width="402" height="44" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="40" y="282" fill="#94a3b8" font-size="16">••••••••••••</text>
    <text x="390" y="282" fill="#818cf8" font-size="12" font-weight="500" text-anchor="end">Show</text>

    <!-- Remember & Forgot -->
    <rect x="24" y="318" width="16" height="16" rx="4" fill="#4f46e5"/>
    <path d="M27 326 L30 329 L37 322" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="48" y="331" fill="#94a3b8" font-size="13">Remember me for 24h</text>
    <text x="426" y="331" fill="#818cf8" font-size="13" font-weight="500" text-anchor="end">Secure HTTP-only</text>

    <!-- Submit Button -->
    <rect x="24" y="360" width="402" height="46" rx="10" fill="url(#btn-grad)"/>
    <text x="225" y="388" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Sign In to Dashboard →</text>

    <!-- Security Note -->
    <rect x="24" y="430" width="402" height="56" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="44" cy="458" r="8" fill="#10b981" fill-opacity="0.2"/>
    <circle cx="44" cy="458" r="4" fill="#10b981"/>
    <text x="62" y="452" fill="#f8fafc" font-size="12" font-weight="600">Enterprise Argon2id Password Encryption</text>
    <text x="62" y="468" fill="#64748b" font-size="11">Protected by SvelteKit same-origin proxy and HTTP-only session cookies</text>
  </g>
</svg>
