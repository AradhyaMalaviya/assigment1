<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#0f172a;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif">
  <!-- Top Navigation Bar -->
  <rect width="1200" height="64" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <g transform="translate(32, 16)">
    <rect width="32" height="32" rx="8" fill="#4f46e5"/>
    <path d="M8 11 L16 18 L24 11 M8 11 L24 11 L24 23 L8 23 Z" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="22" fill="#ffffff" font-size="18" font-weight="700">Bulk Email Sender</text>
  </g>

  <!-- Nav Links -->
  <g transform="translate(320, 22)">
    <text x="45" y="16" fill="#94a3b8" font-size="14" font-weight="500" text-anchor="middle">Dashboard</text>
    <text x="140" y="16" fill="#94a3b8" font-size="14" font-weight="500">Compose</text>
    <rect x="200" y="-4" width="110" height="32" rx="6" fill="#334155"/>
    <text x="255" y="16" fill="#818cf8" font-size="14" font-weight="600" text-anchor="middle">SMTP Configs</text>
    <text x="360" y="16" fill="#94a3b8" font-size="14" font-weight="500">Scheduled Jobs</text>
    <text x="490" y="16" fill="#94a3b8" font-size="14" font-weight="500">Reports</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(64, 96)">
    <!-- Header with Action -->
    <text x="0" y="24" fill="#f8fafc" font-size="24" font-weight="700">SMTP Server Configurations</text>
    <text x="0" y="46" fill="#94a3b8" font-size="13">Manage multiple outbound email servers, test credentials, and configure default senders</text>

    <g transform="translate(880, 10)">
      <rect width="192" height="40" rx="8" fill="#4f46e5"/>
      <text x="96" y="25" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">+ Add Configuration</text>
    </g>

    <!-- Configuration Cards Grid -->
    <g transform="translate(0, 75)">
      <!-- Card 1: Default AWS SES (Active) -->
      <g transform="translate(0, 0)">
        <rect width="1072" height="150" rx="12" fill="#1e293b" stroke="#4f46e5" stroke-width="2"/>
        
        <!-- Header & Badges -->
        <g transform="translate(24, 24)">
          <text x="0" y="16" fill="#f8fafc" font-size="18" font-weight="700">Company Marketing (AWS SES)</text>
          <rect x="280" y="0" width="80" height="22" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
          <text x="320" y="15" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">★ DEFAULT</text>

          <rect x="370" y="0" width="90" height="22" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
          <text x="415" y="15" fill="#a5b4fc" font-size="11" font-weight="600" text-anchor="middle">Custom SMTP</text>
        </g>

        <!-- Details Row -->
        <g transform="translate(24, 65)">
          <text x="0" y="14" fill="#94a3b8" font-size="12">Host:</text>
          <text x="40" y="14" fill="#f8fafc" font-size="13" font-weight="600">email-smtp.us-east-1.amazonaws.com:587</text>

          <text x="360" y="14" fill="#94a3b8" font-size="12">From:</text>
          <text x="400" y="14" fill="#f8fafc" font-size="13" font-weight="600">Marketing Team &lt;marketing@company.com&gt;</text>

          <text x="0" y="44" fill="#94a3b8" font-size="12">Username:</text>
          <text x="75" y="44" fill="#f8fafc" font-size="13">AKIAIOSFODNN7EXAMPLE</text>

          <text x="360" y="44" fill="#94a3b8" font-size="12">Password:</text>
          <text x="430" y="44" fill="#64748b" font-size="13">•••••••••••••••• (Masked)</text>
        </g>

        <!-- Actions -->
        <g transform="translate(760, 55)">
          <!-- Test Connection Button -->
          <rect x="0" y="0" width="130" height="36" rx="6" fill="#065f46" stroke="#059669" stroke-width="1"/>
          <text x="65" y="22" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">✓ Test Connect</text>

          <!-- Edit Button -->
          <rect x="140" y="0" width="70" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1"/>
          <text x="175" y="22" fill="#f8fafc" font-size="12" font-weight="500" text-anchor="middle">Edit</text>

          <!-- Delete Button (Disabled for default) -->
          <rect x="220" y="0" width="80" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="260" y="22" fill="#64748b" font-size="12" text-anchor="middle">Delete</text>
        </g>
      </g>

      <!-- Card 2: Personal Gmail App Password -->
      <g transform="translate(0, 175)">
        <rect width="1072" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        
        <!-- Header & Badges -->
        <g transform="translate(24, 24)">
          <text x="0" y="16" fill="#f8fafc" font-size="18" font-weight="700">Developer Alerts (Gmail App Password)</text>
          <rect x="360" y="0" width="70" height="22" rx="6" fill="#312e81" stroke="#4338ca" stroke-width="1"/>
          <text x="395" y="15" fill="#818cf8" font-size="11" font-weight="600" text-anchor="middle">Gmail</text>
        </g>

        <!-- Details Row -->
        <g transform="translate(24, 65)">
          <text x="0" y="14" fill="#94a3b8" font-size="12">Host:</text>
          <text x="40" y="14" fill="#f8fafc" font-size="13" font-weight="600">smtp.gmail.com:587 (TLS)</text>

          <text x="360" y="14" fill="#94a3b8" font-size="12">From:</text>
          <text x="400" y="14" fill="#f8fafc" font-size="13" font-weight="600">Alex Alerts &lt;alex.dev@gmail.com&gt;</text>

          <text x="0" y="44" fill="#94a3b8" font-size="12">Daily Limit:</text>
          <text x="75" y="44" fill="#f8fafc" font-size="13">100 emails/day (20 batch size, 45s delay)</text>

          <text x="360" y="44" fill="#94a3b8" font-size="12">Password:</text>
          <text x="430" y="44" fill="#64748b" font-size="13">•••••••••••••••• (16-char App Password)</text>
        </g>

        <!-- Actions -->
        <g transform="translate(670, 55)">
          <rect x="0" y="0" width="110" height="36" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
          <text x="55" y="22" fill="#a5b4fc" font-size="12" font-weight="600" text-anchor="middle">Set Default</text>

          <rect x="120" y="0" width="110" height="36" rx="6" fill="#065f46" stroke="#059669" stroke-width="1"/>
          <text x="175" y="22" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">✓ Test</text>

          <rect x="240" y="0" width="70" height="36" rx="6" fill="#334155" stroke="#475569" stroke-width="1"/>
          <text x="275" y="22" fill="#f8fafc" font-size="12" font-weight="500" text-anchor="middle">Edit</text>

          <rect x="320" y="0" width="70" height="36" rx="6" fill="#450a0a" stroke="#991b1b" stroke-width="1"/>
          <text x="355" y="22" fill="#fca5a5" font-size="12" font-weight="500" text-anchor="middle">Delete</text>
        </g>
      </g>

      <!-- Provider Guidance Box -->
      <g transform="translate(0, 350)">
        <rect width="1072" height="110" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <g transform="translate(24, 20)">
          <text x="0" y="16" fill="#f8fafc" font-size="14" font-weight="700">💡 Gmail App Password Guidance</text>
          <text x="0" y="40" fill="#94a3b8" font-size="12">1. Enable 2-Step Verification in your Google Account security settings.</text>
          <text x="0" y="60" fill="#94a3b8" font-size="12">2. Generate a 16-character App Password under "Security" → "App passwords".</text>
          <text x="0" y="80" fill="#94a3b8" font-size="12">3. Enter the 16 characters without spaces. Standard Google Account passwords are rejected by Gmail SMTP servers.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
