<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#0f172a;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif">
  <!-- Top Navigation Bar -->
  <rect width="1200" height="64" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <g transform="translate(32, 16)">
    <rect width="32" height="32" rx="8" fill="#4f46e5"/>
    <path d="M8 11 L16 18 L24 11 M8 11 L24 11 L24 23 L8 23 Z" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="22" fill="#ffffff" font-size="18" font-weight="700">Bulk Email Sender</text>
  </g>

  <!-- Nav Links -->
  <g transform="translate(320, 22)">
    <text x="45" y="16" fill="#94a3b8" font-size="14" font-weight="500" text-anchor="middle">Dashboard</text>
    <text x="140" y="16" fill="#94a3b8" font-size="14" font-weight="500">Compose</text>
    <text x="240" y="16" fill="#94a3b8" font-size="14" font-weight="500">SMTP Configs</text>
    <rect x="330" y="-4" width="125" height="32" rx="6" fill="#334155"/>
    <text x="392" y="16" fill="#818cf8" font-size="14" font-weight="600" text-anchor="middle">Scheduled Jobs</text>
    <text x="490" y="16" fill="#94a3b8" font-size="14" font-weight="500">Reports</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(64, 96)">
    <!-- Header -->
    <text x="0" y="24" fill="#f8fafc" font-size="24" font-weight="700">Scheduled Campaigns Queue</text>
    <text x="0" y="46" fill="#94a3b8" font-size="13">Manage upcoming automated campaign dispatches queued in the background SQLite scheduler</text>

    <!-- Scheduler Cadence Banner -->
    <g transform="translate(0, 65)">
      <rect width="1072" height="42" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
      <circle cx="24" cy="21" r="5" fill="#818cf8"/>
      <text x="38" y="26" fill="#c7d2fe" font-size="12" font-weight="500">ℹ️ Scheduler Cadence: Evaluated every 60s by SQLite background daemon. Displaying local timezone: Asia/Kolkata (UTC+05:30)</text>
    </g>

    <!-- Search & Filter Controls -->
    <g transform="translate(0, 120)">
      <!-- Search Input -->
      <rect x="0" y="0" width="340" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" fill="#94a3b8" font-size="13">🔍 Filter by subject, config, or job ID...</text>

      <!-- Status Tabs -->
      <g transform="translate(730, 0)">
        <rect x="0" y="0" width="342" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <rect x="4" y="4" width="105" height="30" rx="6" fill="#4f46e5"/>
        <text x="56" y="23" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">All Jobs (3)</text>
        <text x="170" y="23" fill="#94a3b8" font-size="12" font-weight="500" text-anchor="middle">Scheduled (2)</text>
        <text x="285" y="23" fill="#94a3b8" font-size="12" font-weight="500" text-anchor="middle">Running (1)</text>
      </g>
    </g>

    <!-- Scheduled Jobs Table -->
    <g transform="translate(0, 175)">
      <rect width="1072" height="380" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      
      <!-- Table Header -->
      <rect width="1072" height="42" rx="12" fill="#0f172a"/>
      <text x="24" y="26" fill="#94a3b8" font-size="12" font-weight="600">CAMPAIGN SUBJECT</text>
      <text x="340" y="26" fill="#94a3b8" font-size="12" font-weight="600">SCHEDULED TIME (LOCAL)</text>
      <text x="560" y="26" fill="#94a3b8" font-size="12" font-weight="600">CONFIG &amp; RECIPIENTS</text>
      <text x="760" y="26" fill="#94a3b8" font-size="12" font-weight="600">MODE</text>
      <text x="870" y="26" fill="#94a3b8" font-size="12" font-weight="600">STATUS</text>
      <text x="980" y="26" fill="#94a3b8" font-size="12" font-weight="600">ACTIONS</text>

      <!-- Row 1: Running Job -->
      <g transform="translate(0, 42)">
        <rect width="1072" height="68" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
        <text x="24" y="28" fill="#f8fafc" font-size="14" font-weight="600">Q3 Product Launch Announcement</text>
        <text x="24" y="48" fill="#64748b" font-size="11">Job ID: job_98b4f1</text>

        <text x="340" y="28" fill="#f8fafc" font-size="13">Aug 20, 2026, 06:00 PM</text>
        <text x="340" y="48" fill="#64748b" font-size="11">Fired 8 mins ago</text>

        <text x="560" y="28" fill="#f8fafc" font-size="13">Company Marketing</text>
        <text x="560" y="48" fill="#94a3b8" font-size="11">100 contacts</text>

        <rect x="760" y="18" width="76" height="22" rx="4" fill="#1e1b4b"/>
        <text x="798" y="33" fill="#a5b4fc" font-size="11" font-weight="600" text-anchor="middle">Batch (20/hr)</text>

        <rect x="870" y="18" width="76" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
        <text x="908" y="33" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">⚡ RUNNING</text>

        <!-- Disabled Cancel Button (with tooltip lock) -->
        <rect x="975" y="16" width="75" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="1012" y="34" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">Locked 🔒</text>
      </g>

      <!-- Row 2: Upcoming Scheduled 1 -->
      <g transform="translate(0, 110)">
        <rect width="1072" height="68" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
        <text x="24" y="28" fill="#f8fafc" font-size="14" font-weight="600">Weekly Tech Newsletter #142</text>
        <text x="24" y="48" fill="#64748b" font-size="11">Job ID: job_71c2a9</text>

        <text x="340" y="28" fill="#f8fafc" font-size="13">Aug 22, 2026, 09:00 AM</text>
        <text x="340" y="48" fill="#38bdf8" font-size="11">In 1 day, 15 hours</text>

        <text x="560" y="28" fill="#f8fafc" font-size="13">Company Marketing</text>
        <text x="560" y="48" fill="#94a3b8" font-size="11">450 contacts</text>

        <rect x="760" y="18" width="76" height="22" rx="4" fill="#1e1b4b"/>
        <text x="798" y="33" fill="#a5b4fc" font-size="11" font-weight="600" text-anchor="middle">Batch (50/hr)</text>

        <rect x="870" y="18" width="84" height="22" rx="4" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
        <text x="912" y="33" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">SCHEDULED</text>

        <!-- Active Cancel Button -->
        <rect x="975" y="16" width="75" height="28" rx="6" fill="#450a0a" stroke="#991b1b" stroke-width="1"/>
        <text x="1012" y="34" fill="#fca5a5" font-size="11" font-weight="600" text-anchor="middle">Cancel</text>
      </g>

      <!-- Row 3: Upcoming Scheduled 2 -->
      <g transform="translate(0, 178)">
        <rect width="1072" height="68" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
        <text x="24" y="28" fill="#f8fafc" font-size="14" font-weight="600">Webinar Confirmation Reminders</text>
        <text x="24" y="48" fill="#64748b" font-size="11">Job ID: job_34e8d2</text>

        <text x="340" y="28" fill="#f8fafc" font-size="13">Aug 24, 2026, 02:30 PM</text>
        <text x="340" y="48" fill="#38bdf8" font-size="11">In 3 days, 20 hours</text>

        <text x="560" y="28" fill="#f8fafc" font-size="13">Developer Alerts</text>
        <text x="560" y="48" fill="#94a3b8" font-size="11">120 contacts</text>

        <rect x="760" y="18" width="76" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="798" y="33" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Sequential</text>

        <rect x="870" y="18" width="84" height="22" rx="4" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
        <text x="912" y="33" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">SCHEDULED</text>

        <rect x="975" y="16" width="75" height="28" rx="6" fill="#450a0a" stroke="#991b1b" stroke-width="1"/>
        <text x="1012" y="34" fill="#fca5a5" font-size="11" font-weight="600" text-anchor="middle">Cancel</text>
      </g>
    </g>
  </g>
</svg>
