documentation:
  - '**/*.md'
  - 'docs/**/*'

dependencies:
  - 'package.json'
  - 'package-lock.json'

frontend:
  - 'frontend/**/*'

backend:
  - 'src/**/*.ts'

services:
  - 'src/services/**/*'

routes:
  - 'src/routes/**/*'

middleware:
  - 'src/middleware/**/*'

config:
  - 'tsconfig.json'
  - '.env.example'
  - '*.config.js'
  - '*.config.ts'

tests:
  - '**/*.test.ts'
  - '**/*.spec.ts'
  - 'tests/**/*'

ci-cd:
  - '.github/**/*'
