name: PR & CI Checks

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  backend-checks:
    name: Backend Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend TypeScript typecheck
        run: npm run typecheck

      - name: Run backend tests
        run: npm test

  frontend-checks:
    name: Frontend Typecheck, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run SvelteKit typecheck (svelte-check)
        working-directory: ./frontend
        run: npm run check

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run SvelteKit production build
        working-directory: ./frontend
        run: npm run build
